<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/vnd.microsoft.icon"
      sizes="16x16 32x32 48x48"
      href="/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/brand/brum-engine-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/brum-engine-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/brand/brum-engine-48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/brum-engine-180.png"
    />
    <meta
      name="description"
      content="Brum keeps your local world running. Worktrees, apps, ports, logs, and coding-agent tasks in one place."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f3ebd8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#081213"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      "use strict";
      (() => {
        const root = document.documentElement;
        let theme = "system";
        try {
          theme = localStorage.getItem("branchbase:theme") ?? "system";
        } catch {
          // Use the system theme when storage is unavailable.
        }
        let resolved = theme;
        if (theme !== "light" && theme !== "dark") {
          resolved = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        root.classList.add(resolved);
        root.style.colorScheme = resolved;
      })();
    </script>
    <title>Brum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
